name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: contribution_finder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cf:cf@localhost:5432/contribution_finder_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @cf/web exec playwright install --with-deps chromium
      - run: pnpm --filter @cf/web test:e2e
