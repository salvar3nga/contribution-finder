name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cf
          POSTGRES_PASSWORD: cf
          POSTGRES_DB: contribution_finder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cf"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://cf:cf@localhost:5432/contribution_finder_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @cf/web exec playwright install --with-deps chromium
      - run: pnpm --filter @cf/web test:e2e
