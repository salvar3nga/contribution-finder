name: Nightly ingest
on:
  schedule:
    - cron: '0 3 * * 0'
    - cron: '0 3 * * 1-6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate database (retries while Neon wakes up)
        run: |
          for attempt in 1 2 3 4 5; do
            pnpm --filter @cf/db migrate && exit 0
            sleep 10
          done
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Ingest (discovery runs on Sundays and manual runs)
        run: pnpm --filter @cf/ingest start --max-repos 2500 ${{ github.event.schedule == '0 3 * * 1-6' && '--skip-discovery' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INGEST_GITHUB_TOKEN }}
